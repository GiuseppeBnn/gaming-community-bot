services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gamingbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot_network
    # 💡 OTTIMIZZAZIONE POSTGRES: Riduciamo l'uso di RAM interno di Postgres
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB
    deploy:
      resources:
        limits:
          memory: 256M # 🔒 Massimo 256MB di RAM a Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gamingbot"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    networks:
      - bot_network
    # 💡 OTTIMIZZAZIONE REDIS: Metti un tetto massimo alla cache
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 128M # 🔒 Massimo 128MB di RAM a Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  bot:
    build: .
    # Tag used by `docker compose build` and pulled by `docker compose pull`.
    # Override BOT_IMAGE to point at your GHCR image (built by CI):
    #   prod    →  BOT_IMAGE=ghcr.io/<owner>/gaming-community-bot:latest      (HEAD di main)
    #   release →  BOT_IMAGE=ghcr.io/<owner>/gaming-community-bot:1.2.3       (versione immutabile)
    #   staging →  BOT_IMAGE=ghcr.io/<owner>/gaming-community-bot:latest-test (HEAD di test)
    image: ${BOT_IMAGE:-gaming-community-bot:local}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bot_network
    volumes:
      - ./data:/app/data
      # Backup snapshots + chat archive (§25) — persisted across restarts.
      # NOTE: a *named* volume (not a ./backups bind mount) so Docker initializes
      # it with the image dir's ownership (botuser, UID 1001). A host bind mount
      # would be owned by the host UID → the non-root botuser gets EACCES on write.
      # Backups are retrievable via the /backup·/esporta DM and `docker cp`.
      - bot_backups:/app/backups
    # 🔄 Watchtower aggiorna SOLO i container con questa label (vedi servizio sotto).
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          memory: 300M # 🔒 Massimo 300MB di RAM al Bot Python

  # ───────────────────────────────────────────────────────────────────────────
  # Auto-update del solo servizio `bot` (Watchtower).
  #
  # COSA FA: ogni 10 min controlla se il *tag* in esecuzione (es. …:latest-test)
  # punta a un DIGEST diverso nel registry. Se sì → pull della nuova immagine,
  # stop graceful del vecchio container, ricreazione con la STESSA config
  # (volumi/env/network/label invariati), restart. Con CLEANUP la vecchia
  # immagine viene rimossa subito → niente accumulo di versioni sul disco.
  #
  # PERCHÉ il digest e non "il secondo tag sha": `latest-test` è un puntatore
  # mutabile; quando la CI lo ripubblica, il suo digest cambia — ed è esattamente
  # ciò che Watchtower confronta. Più semplice e affidabile che leggere il tag
  # sha-…-test, che resta utile solo come pin per il rollback manuale:
  #   BOT_IMAGE=ghcr.io/<owner>/gaming-community-bot:sha-XXXXXXX-test
  #   docker compose up -d
  #
  # SCOPE: aggiorna SOLO i container con label watchtower.enable=true → qui solo
  # `bot`. db/redis (tag upstream fissi) e watchtower stesso NON vengono toccati.
  #
  # AUTH: il package GHCR è PUBBLICO → nessuna credenziale necessaria. (Se un
  # domani lo rendi privato, aggiungi il volume `${HOME}/.docker/config.json:/config.json:ro`
  # dopo aver fatto `docker login ghcr.io` sull'host.)
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # L'immagine containrrr (non più manutenuta) di default manda l'header API
      # Docker 1.25, rifiutato dai daemon moderni (min 1.40). Forziamo una versione
      # supportata: il client la sa parlare, va solo dichiarata esplicitamente.
      DOCKER_API_VERSION: "1.41"
      WATCHTOWER_POLL_INTERVAL: 600        # 🕙 controlla ogni 10 minuti
      WATCHTOWER_LABEL_ENABLE: "true"      # aggiorna solo i container con enable=true
      WATCHTOWER_CLEANUP: "true"           # 🧹 rimuove la vecchia immagine dopo l'update
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Rome}
      # — Notifica Telegram opzionale a ogni update (riusa il bot) —
      # WATCHTOWER_NOTIFICATIONS: shoutrrr
      # WATCHTOWER_NOTIFICATION_URL: telegram://${BOT_TOKEN}@telegram?chats=<ADMIN_CHAT_ID>
    networks:
      - bot_network
    deploy:
      resources:
        limits:
          memory: 64M # 🔒 Watchtower è leggerissimo

networks:
  bot_network:
    driver: bridge

volumes:
  postgres_data:
  bot_backups: