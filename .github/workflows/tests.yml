name: Tests

# Runs directly on feature-branch pushes and every PR. Release branches/tags invoke
# the same reusable workflow from docker-image.yml, so each commit is tested once
# while the image build remains strictly gated on the result.
on:
  push:
    branches-ignore: [main, test, test_giu]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # If an async worker hangs, Python prints all thread stacks when GNU timeout
      # sends SIGABRT. Unbuffered output preserves the last useful test log line.
      PYTHONFAULTHANDLER: "1"
      PYTHONUNBUFFERED: "1"

    # A real PostgreSQL for the `pg`-marked tests. Two things are invisible to the
    # SQLite suite and both live on the money path: `SELECT ... FOR UPDATE` is a
    # no-op on SQLite, and its in-memory engine gives every session the same
    # connection (so the same transaction) — a two-session race cannot be written
    # there. It also gives `_MIGRATIONS` its first execution by any test, and that
    # DDL runs in production on every deploy.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gamingbot_test  # the `_test` suffix is required by pg_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          # Minimal env required by pydantic-settings (no real token needed in CI)
          BOT_TOKEN: "1234567890:AAFtesttoken_github_actions"
          DAILY_REWARD_COINS: "100"
          # Stays SQLite: database.connection builds its engine at import time, and
          # the app engine must not point at the test database.
          DB_URL: "sqlite+aiosqlite:///:memory:"
          # Enables the `pg`-marked tests. Unset (as in a plain local run) they skip.
          TEST_PG_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/gamingbot_test"
        # -rxX lists xfails and xpasses: the money-path race tests are xfail(strict),
        # so an unexpected PASS fails the build and means that site is already safe.
        run: >-
          timeout --signal=ABRT --kill-after=30s 15m
          pytest --cov=src --cov-report=xml --cov-report=term-missing -rxX

      # Static gates run AFTER the suite on purpose: a lint nit must never hide a
      # failing test in the log. Both are configured in pyproject.toml.
      # `tests/` is gated too: a dead import or a non-strict zip in a test is the
      # same defect as in src, and an unused variable there often means an
      # assertion that was meant to use it.
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
        # Optional: set CODECOV_TOKEN in repo secrets for private repos
